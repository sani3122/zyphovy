name: TFLIX M3U Scraper

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  scrape-tflix:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install All Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp "camoufox[geoip]" Pillow pycountry

      - name: Install Display Drivers & System Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgbm-dev libasound2 fonts-dejavu-core
          python -m camoufox fetch

      - name: Execute TFLIX Scraper
        env:
          TZ: 'Asia/Dhaka'
          HEADLESS: 'false'
        run: |
          xvfb-run --auto-servernum python tflix_scrapper.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add live_playlist.m3u logos/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update TFLIX live streams [skip ci]" && git push)
