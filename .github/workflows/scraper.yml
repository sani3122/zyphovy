name: Auto Update Live Sports Playlist

on:
  schedule:
    # Runs at the top of every hour
    - cron: '15 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install Camoufox browser binaries
          python -m camoufox fetch

      - name: Run Scraper Script
        run: python streamed.py

      - name: Commit and Push Updated Playlist
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add live_playlist.m3u
          
          # Only commit if live_playlist.m3u has changes
          if git diff --staged --quiet; then
            echo "No changes detected in live_playlist.m3u"
          else
            git commit -m "Auto-update live_playlist.m3u [skip ci]"
            git push
          fi
